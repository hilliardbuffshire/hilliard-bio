<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bio-Supercycle — Dominance Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#c9a84c; --gold-light:#e8c97a; --bg:#0d0d0f; --bg2:#13131a; --bg3:#1b1b22;
    --text:#f0ead8; --text-dim:#a09880; --border:rgba(201,168,76,0.2);
    --green:#3fd18a; --red:#cf6679; --fact:#c9a84c; --est:#7d7456;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;line-height:1.5;padding:0 16px 64px}
  .wrap{max-width:1000px;margin:0 auto}
  header{text-align:center;padding:40px 0 14px;position:relative}
  .back{position:absolute;left:0;top:44px;color:var(--gold);text-decoration:none;font-size:13px;font-family:'Inter',sans-serif}
  .icon{font-size:46px;line-height:1}
  h1{font-weight:300;font-size:32px;letter-spacing:1px;margin-top:10px}
  .sub{color:var(--text-dim);font-weight:300;margin-top:8px;font-size:15px}
  .meta{color:var(--text-dim);font-size:13px;margin-top:12px;font-family:'Inter',sans-serif}
  .toggle{display:flex;gap:8px;justify-content:center;margin:18px 0 6px}
  .tbtn{font-family:'Noto Sans KR';font-size:14px;font-weight:500;padding:9px 18px;border-radius:24px;border:1px solid var(--border);background:var(--bg2);color:var(--text-dim);cursor:pointer;transition:all .15s}
  .tbtn.on{background:var(--gold-dim,rgba(201,168,76,0.16));color:var(--gold-light);border-color:var(--gold)}
  .lensnote{text-align:center;color:var(--text-dim);font-size:12px;font-weight:300;margin-bottom:18px;min-height:16px}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:12px;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-2px);border-color:rgba(201,168,76,0.4)}
  .chead{display:flex;align-items:flex-start;gap:14px}
  .rank{font-family:'Inter';font-size:20px;font-weight:700;color:var(--text-dim);min-width:26px;padding-top:6px}
  .cmain{flex:1;min-width:0}
  .name{font-weight:500;font-size:17px}
  .tkr{color:var(--text-dim);font-size:14px;font-family:'Inter'}
  .tag{color:var(--text-dim);font-size:12px}
  .scorebox{text-align:right;white-space:nowrap}
  .bigscore{font-family:'Inter';font-size:26px;font-weight:700;color:var(--gold-light)}
  .cov{font-size:11px;color:var(--text-dim);font-family:'Inter'}
  .other{font-size:12px;color:var(--text-dim);font-family:'Inter';margin-top:2px}
  .bull{margin-top:10px;font-size:13.5px;font-weight:300}
  .bull b{color:var(--green);font-weight:500}
  .risk{margin-top:5px;font-size:13.5px;font-weight:300}
  .risk b{color:var(--red);font-weight:500}
  .factors{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:5px 18px}
  .frow{display:flex;align-items:center;gap:8px;font-size:11.5px;font-family:'Inter'}
  .flabel{color:var(--text-dim);min-width:78px;font-family:'Noto Sans KR'}
  .bar{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
  .fill{height:100%;border-radius:3px}
  .fbasis{font-size:9.5px;min-width:30px;text-align:right}
  .foot{text-align:center;color:var(--text-dim);font-size:12px;margin-top:30px;font-weight:300;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="https://hilliardbuffshire.github.io/hilliard-hub/">← Hub</a>
    <div class="icon">🧬</div>
    <h1>Bio-Supercycle</h1>
    <p class="sub">유전자가위 · 생명연장 — "바이오의 엔비디아" 후보를 증거 기반으로 채점</p>
    <p class="meta" id="meta">불러오는 중…</p>
  </header>
  <div class="toggle" id="toggle"></div>
  <div class="lensnote" id="lensnote"></div>
  <main id="board"></main>
  <p class="foot">
    7개 요인(플랫폼·임상·해자·규제·스마트머니·시장·경쟁) × 2개 렌즈 · <b style="color:var(--fact)">금색=검증된 사실</b> / <span style="color:var(--est)">흐림=분석가 판단</span> · 근거% = 점수가 실제 증거로 뒷받침된 비율<br>
    리서치 도구일 뿐 투자 자문이 아닙니다 · Hilliard Buffshire — Bio-Supercycle Research Platform
  </p>
</div>
<script>
  const FACTORS=[["platform_breadth","플랫폼 확장"],["clinical_proof","임상 증명"],["tech_moat","기술 해자"],["regulatory","규제 인정"],["smart_money","스마트머니"],["tam","시장 규모"],["competitive_lead","경쟁 우위"]];
  const LENS={balanced:"균형 종합",platform_moat:"플랫폼 + 해자"};
  const LENSNOTE={balanced:"임상 증명·기술 해자에 가중 — 가장 검증된 종합 강자 순",platform_moat:"플랫폼 확장성·IP 해자에 가중 — '엔비디아형' 초기 플랫폼 베팅 순"};
  let DATA=null, lens="balanced";
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function fnum(x){return (typeof x==='number')?x.toFixed(2):'—';}

  fetch('data.json?v='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;init();})
    .catch(()=>{document.getElementById('meta').textContent='데이터를 불러오지 못했습니다.';});

  function init(){
    const dt=DATA.generated_at?new Date(DATA.generated_at):null;
    const n=(DATA.companies||DATA.watchlist||[]).length;
    document.getElementById('meta').textContent='최종 갱신: '+(dt?dt.toLocaleString('ko-KR'):'—')+' · '+n+'개 종목';
    if(DATA.mode!=='dominance'){document.getElementById('board').innerHTML='<p style="text-align:center;color:var(--text-dim)">dominance 데이터 없음</p>';return;}
    const tg=document.getElementById('toggle');
    Object.keys(LENS).forEach(k=>{
      const b=document.createElement('button');b.className='tbtn'+(k===lens?' on':'');b.textContent=LENS[k];
      b.onclick=()=>{lens=k;[...tg.children].forEach(c=>c.classList.toggle('on',c.textContent===LENS[k]));render();};
      tg.appendChild(b);
    });
    render();
  }

  function render(){
    document.getElementById('lensnote').textContent=LENSNOTE[lens];
    const comps=[...DATA.companies].sort((a,b)=>((b[lens]||{}).score||0)-((a[lens]||{}).score||0));
    document.getElementById('board').innerHTML=comps.map((c,i)=>card(c,i)).join('');
  }

  function card(c,i){
    const act=c[lens]||{}, otherK=lens==='balanced'?'platform_moat':'balanced';
    const other=c[otherK]||{};
    let f='';
    FACTORS.forEach(([k,label])=>{
      const fd=(c.factors||{})[k]||{}, s=fd.score, basis=fd.basis||'';
      const col=basis==='fact'?'var(--fact)':(basis==='estimate'?'var(--est)':'transparent');
      const w=(typeof s==='number')?Math.round(s*100):0;
      const btag=basis==='fact'?'사실':(basis==='estimate'?'판단':'—');
      f+='<div class="frow"><span class="flabel">'+label+'</span><span class="bar"><span class="fill" style="width:'+w+'%;background:'+col+'"></span></span><span class="fbasis" style="color:'+(basis==='fact'?'var(--fact)':'var(--text-dim)')+'">'+btag+'</span></div>';
    });
    return '<div class="card"><div class="chead">'
      +'<div class="rank">'+(i+1)+'</div>'
      +'<div class="cmain"><div class="name">'+esc(c.company)+(c.ticker?' <span class="tkr">('+esc(c.ticker)+')</span>':'')+'</div>'
      +'<div class="tag">'+esc(c.subsector)+'</div></div>'
      +'<div class="scorebox"><div class="bigscore">'+fnum(act.score)+'</div>'
      +'<div class="cov">근거 '+(typeof act.coverage==='number'?Math.round(act.coverage*100):0)+'%</div>'
      +'<div class="other">'+(otherK==='balanced'?'균형':'플랫폼+해자')+' '+fnum(other.score)+'</div></div></div>'
      +(c.bull?'<div class="bull"><b>Bull</b> · '+esc(c.bull)+'</div>':'')
      +(c.risk?'<div class="risk"><b>Risk</b> · '+esc(c.risk)+'</div>':'')
      +'<div class="factors">'+f+'</div></div>';
  }
</script>
</body>
</html>
